name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── Backend ──────────────────────────────────────────────────────────────────
  backend:
    name: Backend — Lint + Type + Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: |
          pip install ruff -q
          ruff check . --select E,W,F --ignore E501 || true

      - name: Type check (mypy)
        run: |
          pip install mypy -q
          mypy . --ignore-missing-imports --exclude migrations || true

      - name: Run unit tests
        env:
          DATABASE_URL: sqlite:///./test_ci.db
          APP_MODE: demo
          SECRET_KEY: ci-test-secret-key
          OPENAI_API_KEY: sk-demo
          RAZORPAY_KEY_ID: rzp_test_demo
          RAZORPAY_KEY_SECRET: demo_secret
          RAZORPAY_WEBHOOK_SECRET: demo_webhook
        run: |
          pytest ../../tests/unit -v --tb=short

      - name: Run integration tests
        env:
          DATABASE_URL: sqlite:///./test_ci_int.db
          APP_MODE: demo
          SECRET_KEY: ci-test-secret-key
          OPENAI_API_KEY: sk-demo
          RAZORPAY_KEY_ID: rzp_test_demo
          RAZORPAY_KEY_SECRET: demo_secret
          RAZORPAY_WEBHOOK_SECRET: demo_webhook
        run: |
          pytest ../../tests/integration -v --tb=short

      - name: Run security tests
        env:
          DATABASE_URL: sqlite:///./test_ci_sec.db
          APP_MODE: demo
          SECRET_KEY: ci-test-secret-key
          OPENAI_API_KEY: sk-demo
          RAZORPAY_KEY_ID: rzp_test_demo
          RAZORPAY_KEY_SECRET: demo_secret
          RAZORPAY_WEBHOOK_SECRET: demo_webhook
        run: |
          pytest ../../tests/security -v --tb=short

  # ── Frontend ──────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend — Type Check + Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npx next lint --max-warnings 0 || true

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build
