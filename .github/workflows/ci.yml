name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── Backend ──────────────────────────────────────────────────────────────────
  backend-lint:
    name: Backend — Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Phase 26: BLOCKING lint — failures break the build
      - name: Lint (ruff)
        run: |
          pip install ruff -q
          ruff check . --select E,W,F --ignore E501

      # Phase 26: BLOCKING type check
      - name: Type check (mypy)
        run: |
          pip install mypy types-python-jose types-passlib -q
          mypy . --ignore-missing-imports --exclude migrations --exclude venv --exclude .venv

  backend-test:
    name: Backend — Tests (194)
    runs-on: ubuntu-latest
    needs: backend-lint
    defaults:
      run:
        working-directory: services/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Phase 26: Run ALL tests together to catch cross-test interactions
      - name: Run full test suite
        env:
          DATABASE_URL: "sqlite://"
          APP_MODE: demo
          SECRET_KEY: ci-test-secret-key-not-for-prod
          OPENAI_API_KEY: sk-demo
          RAZORPAY_KEY_ID: rzp_test_demo
          RAZORPAY_KEY_SECRET: demo_secret
          RAZORPAY_WEBHOOK_SECRET: demo_webhook
          TESTING: "1"
        run: |
          pytest ../../tests/ -v --tb=short

  # Phase 26: Dependency vulnerability scan
  backend-audit:
    name: Backend — Dependency Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Audit dependencies (pip-audit)
        run: |
          pip install pip-audit -q
          pip-audit --strict --desc || echo "::warning::pip-audit found vulnerabilities — review before production"

  # Phase 26: Migration verification
  backend-migrations:
    name: Backend — Migration Check
    runs-on: ubuntu-latest
    needs: backend-lint
    defaults:
      run:
        working-directory: services/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify Alembic migrations
        env:
          DATABASE_URL: "sqlite:///./ci_migration_test.db"
          APP_MODE: demo
          SECRET_KEY: ci-migration-key
          OPENAI_API_KEY: sk-demo
          RAZORPAY_KEY_ID: rzp_test_demo
          RAZORPAY_KEY_SECRET: demo_secret
        run: |
          if [ -d "migrations" ]; then
            alembic check 2>/dev/null || alembic upgrade head
            echo "✓ Migrations applied successfully"
          else
            echo "✓ No Alembic migrations directory — using auto-create"
          fi

  # Phase 26: Docker build verification
  docker:
    name: Docker — Build Verification
    runs-on: ubuntu-latest
    needs: [backend-test]

    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: |
          docker build -t agentsetu-api:ci -f services/api/Dockerfile services/api/

      - name: Verify image runs
        run: |
          docker run --rm -d --name agentsetu-ci \
            -e DATABASE_URL=sqlite:///./test.db \
            -e APP_MODE=demo \
            -e SECRET_KEY=ci-docker-key \
            -e OPENAI_API_KEY=sk-demo \
            -e RAZORPAY_KEY_ID=rzp_test_demo \
            -e RAZORPAY_KEY_SECRET=demo_secret \
            -p 8099:8000 \
            agentsetu-api:ci
          sleep 5
          curl -sf http://localhost:8099/health | grep '"status":"ok"'
          docker stop agentsetu-ci

  # ── Frontend ──────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend — Lint + Type Check + Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Type check
        run: npx tsc --noEmit

      # Phase 26: BLOCKING lint
      - name: Lint
        run: npx next lint --max-warnings 0

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build
